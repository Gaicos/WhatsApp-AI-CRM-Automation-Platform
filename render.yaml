services:
  - type: web
    name: whatsapp-ai-crm-worker
    runtime: node
    rootDir: ChatbotWhatsApp
    plan: free
    buildCommand: npm install --omit=dev --legacy-peer-deps
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TZ
        value: America/Sao_Paulo
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
